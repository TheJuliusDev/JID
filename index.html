<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="google-site-verification" content="SbD0IxtF3bY5eb9CakMPYqeBPacFUv3PNd-J4-uCjA8" />
    <title>JIDapp — OAU Student Marketplace, Ile-Ife</title>
    <meta
      name="description"
      content="Buy and sell used items, electronics, textbooks and hostel furniture on JIDapp, the verified student marketplace and accommodation platform for Obafemi Awolowo University (OAU), Ile-Ife. Student-to-student listings with seller profiles, reviews and direct chat."
    />
    <link rel="canonical" href="https://jidapp.ng/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="application-name" content="JIDapp" />
    <meta name="author" content="JIDapp" />
    <meta name="geo.region" content="NG-OS" />
    <meta name="geo.placename" content="Ile-Ife, Osun State, Nigeria" />
    <meta name="apple-mobile-web-app-title" content="JIDapp" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/favicon.svg" color="#0F7358" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Theme color (matches app light/dark backgrounds) -->
    <meta name="theme-color" content="#FBFAF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E0D0C" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="JIDapp" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_NG" />
    <meta property="og:url" content="https://jidapp.ng/" />
    <meta property="og:title" content="JIDapp — OAU Student Marketplace, Ile-Ife" />
    <meta
      property="og:description"
      content="Buy, sell, and find lodges around Obafemi Awolowo University (OAU), Ile-Ife. The verified student marketplace and accommodation platform for Great Ife."
    />
    <!-- Must be a raster image: WhatsApp, Facebook, X and LinkedIn all reject SVG previews. Regenerate with `npm run og`. -->
    <meta property="og:image" content="https://jidapp.ng/og-image.png" />
    <meta property="og:image:secure_url" content="https://jidapp.ng/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="JIDapp — the verified student marketplace and accommodation platform for OAU, Ile-Ife" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JIDapp — OAU Student Marketplace, Ile-Ife" />
    <meta
      name="twitter:description"
      content="Buy, sell, and find lodges around OAU, Ile-Ife. The verified student marketplace and accommodation platform for Great Ife."
    />
    <meta name="twitter:image" content="https://jidapp.ng/og-image.png" />
    <meta name="twitter:image:alt" content="JIDapp — the verified student marketplace and accommodation platform for OAU, Ile-Ife" />

    <!-- Structured data: lets Google render a brand/entity panel instead of a bare blue link -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://jidapp.ng/#organization",
            "name": "JIDapp",
            "alternateName": "JID Campus Marketplace & Accommodation",
            "url": "https://jidapp.ng/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://jidapp.ng/android-chrome-512x512.png",
              "width": 512,
              "height": 512
            },
            "description": "JIDapp is the verified student marketplace and accommodation platform for Obafemi Awolowo University (OAU), Ile-Ife.",
            "areaServed": {
              "@type": "City",
              "name": "Ile-Ife",
              "containedInPlace": {
                "@type": "State",
                "name": "Osun State"
              }
            },
            "knowsAbout": [
              "Student marketplace",
              "Student accommodation",
              "Obafemi Awolowo University",
              "Ile-Ife"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://jidapp.ng/#website",
            "url": "https://jidapp.ng/",
            "name": "JIDapp",
            "description": "Buy, sell and find student accommodation across Obafemi Awolowo University (OAU), Ile-Ife.",
            "publisher": { "@id": "https://jidapp.ng/#organization" },
            "inLanguage": "en-NG"
          }
        ]
      }
    </script>

    <!-- No-flash theme: apply the saved/system theme before first paint (mirrors ThemeContext) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('jid_campus_theme');
          if (t !== 'light' && t !== 'dark') {
            t =
              window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          }
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#FBFAF8] dark:bg-[#0E0D0C] text-zinc-950 dark:text-zinc-100 antialiased selection:bg-emerald-600 selection:text-white font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
